name: Deploy

on:
  push:
    branches:
      - master  # or the branch you want to use

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3  # Still the latest, will run on Node 20

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'  # Updated to explicitly use Node 20

    - name: Install dependencies
      run: npm install

    - name: Run deploy
      run: npm run deploy
