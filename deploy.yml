name: Deploy

on:
  push:
    branches:
      - master  # or the branch you want to use

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'  # Use the Node.js version your project requires

    - name: Install dependencies
      run: npm install

    - name: Run deploy
      run: npm run deploy
